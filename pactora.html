<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pactora × Midnight | トークン化預金デモ</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 414 414%22%3E%3Ccircle fill=%22%23002496%22 cx=%22207%22 cy=%22207%22 r=%22207%22/%3E%3Cpath fill=%22%2300e3d7%22 d=%22M317.993,216.198h-48.794v.058c-30.147,1.201-54.222,26.008-54.222,56.45,0,31.208,25.299,56.508,56.508,56.508,30.442,0,55.249-24.075,56.45-54.222h.058v-48.793c0-5.523-4.477-10-10-10Z%22/%3E%3C/svg%3E" />
    <!--
      Pactora UI 版 トークン化預金デモ（Midnight Preview × Lace）
      画面・挙動のベース：pactora-phase2-usecase-mock.html（業務 01 トークン化預金）
      オンチェーンの操作は Midnight Preview 上の実トランザクション（ZK 証明 → Lace 承認 → 送信）
    -->
  </head>
  <body>
    <div class="win">
      <div class="chrome"><i></i><i></i><i></i><div class="url" id="url"></div></div>
      <div id="root"></div>
    </div>
    <div class="ov" id="ov"><div class="dlg" id="dlg"></div></div>
    <div id="toast"></div>
    <script>
      // 起動中のエラーを画面に出す（真っ白のままにしない）
      (function () {
        var show = function (msg) {
          var r = document.getElementById('root');
          if (!r || r.childElementCount > 0) return;
          r.innerHTML = '<div style="max-width:900px;margin:60px auto;padding:20px;border:1px solid #e0a3a8;background:#fbf0f1;color:#b4323a;font:13px/1.6 sans-serif;white-space:pre-wrap;word-break:break-all"><b>デモの起動に失敗しました</b>\n' + String(msg).replace(/[<&]/g, function (c) { return c === '<' ? '&lt;' : '&amp;'; }) + '</div>';
        };
        var logs = []; window.__bootLog = logs;
        ['error', 'warn'].forEach(function (k) { var o = console[k]; console[k] = function () { try { logs.push(k + ': ' + Array.prototype.map.call(arguments, function (a) { return a && a.stack ? a.stack : String(a); }).join(' ')); } catch (_) {} return o.apply(console, arguments); }; });
        window.addEventListener('error', function (e) { show((e.error && e.error.stack) || e.message); });
        window.addEventListener('unhandledrejection', function (e) { show((e.reason && e.reason.stack) || e.reason); });
        setTimeout(function () { show('60 秒たっても画面が表示されません（起動の段階: ' + (window.__bootStage || 'スクリプト未実行') + '）。F12 のコンソールを確認してください。\n' + logs.slice(-8).join('\n')); }, 60000);
      })();
    </script>
    <script type="module" src="/src/pactora/main.ts"></script>
  </body>
</html>
