# Pactora UI 版（dist-pactora/）を GitHub Actions でビルドし、GitHub Pages に公開する
#   公開 URL: https://<ユーザー名>.github.io/<リポジトリ名>/
#   事前設定: リポジトリの Settings → Pages → Source を「GitHub Actions」にする
#
#   ledger 9 への移行で、出力は「HTML + assets/（JS・WASM）+ keys/ zkir/ compiler/（ZK 鍵 約 108MB）」になった（ISSUES.md #38）。
#   ビルド結果はコミットせず、ここでビルドする。ZK 鍵はコンパイル済みのもの（contract/managed/tdeposit）を使うので、
#   Compact コンパイラは不要。ソースや docs は公開しない（dist-pactora の中身だけを公開）。
name: Deploy Pactora demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'contract/managed/**'
      - 'pactora.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'vite.pactora.config.ts'
      - '.env'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (dist-pactora)
        run: npm run build:pactora

      - name: Prepare site
        run: |
          cp dist-pactora/pactora-tdeposit-demo.html dist-pactora/index.html
          rm -f dist-pactora/.gitkeep
          touch dist-pactora/.nojekyll
          du -sh dist-pactora/*

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pactora

      - id: deployment
        uses: actions/deploy-pages@v4
